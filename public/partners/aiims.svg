<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- AIIMS Emblem Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Circle -->
    <circle cx="32" cy="32" r="30" fill="#001D6E" />
    <circle cx="32" cy="32" r="26" fill="#FFFFFF" stroke="#001D6E" stroke-width="1.5" />
    <circle cx="32" cy="32" r="21" fill="#F4F7FB" stroke="#C59B27" stroke-width="1.2" />
    
    <!-- Medical Caduceus / Flame Symbol -->
    <path d="M32 16 L32 46" stroke="#001D6E" stroke-width="2.5" stroke-linecap="round" />
    <!-- Serpents / Curves -->
    <path d="M26 22 Q38 27 26 34 Q38 40 32 44" fill="none" stroke="#C59B27" stroke-width="2" stroke-linecap="round" />
    <path d="M38 22 Q26 27 38 34 Q26 40 32 44" fill="none" stroke="#001D6E" stroke-width="2" stroke-linecap="round" />
    <!-- Knowledge Lamp / Star -->
    <circle cx="32" cy="18" r="3.5" fill="#C59B27" />
    <path d="M32 13 L33.5 16 L32 15 L30.5 16 Z" fill="#E53E3E" />
  </g>

  <!-- Typography -->
  <text x="82" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#001D6E" letter-spacing="0.5">AIIMS</text>
  <text x="82" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#1E293B">New Delhi</text>
  <text x="82" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="8.5" fill="#64748B" letter-spacing="0.2">All India Institute of Medical Sciences</text>
</svg>
